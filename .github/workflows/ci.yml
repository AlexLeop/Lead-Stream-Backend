name: Qualidade

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: leadstream_ci
          POSTGRES_USER: leadstream_ci
          POSTGRES_PASSWORD: ci-only-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U leadstream_ci -d leadstream_ci"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12

    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Instalar ambiente reproduzível
        run: |
          python -m pip install uv==0.12.12
          uv sync --frozen --extra dev

      - name: Validar migrations no PostgreSQL
        env:
          DJANGO_SETTINGS_MODULE: config.settings.development
          DJANGO_ALLOWED_HOSTS: testserver
          DATABASE_URL: postgresql://leadstream_ci:ci-only-password@localhost:5432/leadstream_ci
        run: |
          .venv/bin/python manage.py migrate --noinput
          .venv/bin/python manage.py shell -c "from django.test import Client; c = Client(); assert c.get('/health/ready').status_code == 200; assert c.get('/api/v1/workspace/').status_code == 401"

      - name: Executar gates de qualidade
        env:
          TEST_DATABASE_URL: postgresql://leadstream_ci:ci-only-password@localhost:5432/leadstream_ci
        run: sh scripts/quality.sh

      - name: Construir imagem de produção
        run: docker build --tag leadstream-backend:ci .
