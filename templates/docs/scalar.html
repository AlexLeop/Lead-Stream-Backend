<!doctype html>
<html lang="pt-BR" class="dark">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{{ title|default:"LeadStream API • Documentação & Referência Interativa" }}</title>
    <meta name="description" content="Documentação interativa e referência OpenAPI v3 da API LeadStream — Inteligência Cadastral, Enriquecimento e Governança B2B." />

    <!-- Google Fonts: Inter & JetBrains Mono -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap"
      rel="stylesheet"
    />

    <!-- Favicon SVG -->
    <link
      rel="icon"
      type="image/svg+xml"
      href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%2300f2fe' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'><path d='M13 2L3 14h9l-1 8 10-12h-9l1-8z'/></svg>"
    />

    <style>
      :root {
        --ls-bg: #07090e;
        --ls-surface: #0e121a;
        --ls-surface-border: rgba(255, 255, 255, 0.08);
        --ls-primary: #00f2fe;
        --ls-primary-dark: #4facfe;
        --ls-accent: #7928ca;
        --ls-text-main: #f1f5f9;
        --ls-text-muted: #94a3b8;
        --ls-success: #10b981;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        padding: 0;
        background-color: var(--ls-bg);
        font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        color: var(--ls-text-main);
        -webkit-font-smoothing: antialiased;
      }

      /* Sleek Glassmorphism Top Navigation Bar */
      .top-navbar {
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        height: 56px;
        background: rgba(7, 9, 14, 0.88);
        backdrop-filter: blur(16px);
        -webkit-backdrop-filter: blur(16px);
        border-bottom: 1px solid var(--ls-surface-border);
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 0 20px;
        z-index: 1000;
      }

      .brand-group {
        display: flex;
        align-items: center;
        gap: 12px;
        text-decoration: none;
      }

      .brand-icon {
        width: 30px;
        height: 30px;
        border-radius: 8px;
        background: linear-gradient(135deg, #00f2fe 0%, #4facfe 50%, #7928ca 100%);
        display: flex;
        align-items: center;
        justify-content: center;
        box-shadow: 0 0 16px rgba(0, 242, 254, 0.35);
      }

      .brand-icon svg {
        width: 17px;
        height: 17px;
        fill: #07090e;
      }

      .brand-name {
        font-size: 17px;
        font-weight: 700;
        letter-spacing: -0.02em;
        color: #ffffff;
        display: flex;
        align-items: center;
        gap: 8px;
      }

      .version-tag {
        font-size: 11px;
        font-weight: 600;
        padding: 2px 7px;
        border-radius: 999px;
        background: rgba(0, 242, 254, 0.12);
        color: #00f2fe;
        border: 1px solid rgba(0, 242, 254, 0.25);
        letter-spacing: 0.02em;
      }

      .status-indicator {
        display: flex;
        align-items: center;
        gap: 8px;
        font-size: 12px;
        font-weight: 500;
        color: var(--ls-text-muted);
      }

      .pulse-dot {
        width: 8px;
        height: 8px;
        background-color: var(--ls-success);
        border-radius: 50%;
        box-shadow: 0 0 0 0 rgba(16, 185, 129, 0.7);
        animation: pulse 2s infinite;
      }

      @keyframes pulse {
        0% {
          transform: scale(0.95);
          box-shadow: 0 0 0 0 rgba(16, 185, 129, 0.7);
        }
        70% {
          transform: scale(1);
          box-shadow: 0 0 0 7px rgba(16, 185, 129, 0);
        }
        100% {
          transform: scale(0.95);
          box-shadow: 0 0 0 0 rgba(16, 185, 129, 0);
        }
      }

      .nav-links {
        display: flex;
        align-items: center;
        gap: 10px;
      }

      .nav-link {
        display: flex;
        align-items: center;
        gap: 6px;
        padding: 6px 12px;
        border-radius: 6px;
        font-size: 12.5px;
        font-weight: 500;
        text-decoration: none;
        color: var(--ls-text-muted);
        transition: all 0.15s ease;
        border: 1px solid transparent;
      }

      .nav-link:hover {
        color: #ffffff;
        background: rgba(255, 255, 255, 0.05);
        border-color: rgba(255, 255, 255, 0.1);
      }

      .nav-link.active {
        color: #00f2fe;
        background: rgba(0, 242, 254, 0.08);
        border-color: rgba(0, 242, 254, 0.25);
      }

      .nav-link kbd {
        font-family: 'JetBrains Mono', monospace;
        font-size: 10px;
        background: rgba(255, 255, 255, 0.08);
        padding: 2px 5px;
        border-radius: 4px;
        border: 1px solid rgba(255, 255, 255, 0.12);
        color: #cbd5e1;
      }

      /* Container for Scalar Reference below navbar */
      .scalar-container {
        margin-top: 56px;
        min-height: calc(100vh - 56px);
      }

      /* Custom styles to elevate Scalar aesthetics */
      .scalar-card {
        border-radius: 10px !important;
      }

      code, pre {
        font-family: 'JetBrains Mono', monospace !important;
      }
    </style>
  </head>
  <body>
    <!-- Top Branding & Navigation Bar -->
    <header class="top-navbar">
      <div style="display: flex; align-items: center; gap: 24px;">
        <a href="/api/v1/docs/" class="brand-group">
          <div class="brand-icon">
            <svg viewBox="0 0 24 24">
              <path d="M13 2L3 14h9l-1 8 10-12h-9l1-8z" />
            </svg>
          </div>
          <div class="brand-name">
            LeadStream <span style="font-weight: 400; color: var(--ls-text-muted);">API</span>
          </div>
          <span class="version-tag">v2.4.0 Canônico</span>
        </a>

        <div class="status-indicator">
          <span class="pulse-dot"></span>
          <span>Sistemas Operacionais</span>
        </div>
      </div>

      <nav class="nav-links">
        <a href="/api/v1/docs/" class="nav-link active" title="Interface Moderna Scalar">
          <span>⚡ Scalar Docs</span>
        </a>
        <a href="/api/v1/swagger/" class="nav-link" title="Visualizador OpenAPI Swagger UI">
          <span>📜 Swagger UI</span>
        </a>
        <a href="/api/v1/redoc/" class="nav-link" title="Visualizador Técnico ReDoc">
          <span>📑 ReDoc</span>
        </a>
        <a href="/api/v1/schema/" class="nav-link" target="_blank" title="Download do Contrato OpenAPI 3.0 (YAML/JSON)">
          <span>💾 OpenAPI Spec</span>
        </a>
      </nav>
    </header>

    <!-- Scalar API Reference Container -->
    <main class="scalar-container">
      <script
        id="api-reference"
        data-url="{{ schema_url|default:'/api/v1/schema/' }}"
        data-configuration='{
          "theme": "deepSpace",
          "darkMode": true,
          "layout": "modern",
          "showSidebar": true,
          "searchHotKey": "k",
          "defaultOpenAllTags": false,
          "hideModels": false,
          "hideDownloadButton": false,
          "defaultHttpClient": {
            "targetKey": "python",
            "clientKey": "httpx"
          },
          "metaData": {
            "title": "LeadStream API Reference",
            "description": "Documentação Oficial da API LeadStream — Inteligência Cadastral, Enriquecimento e Governança B2B"
          }
        }'></script>
      <script src="https://cdn.jsdelivr.net/npm/@scalar/api-reference"></script>
    </main>
  </body>
</html>
